# ================================================================
# LifeOS — Local Development Stack
#
# Usage:
#   docker compose up --build
#
# Frontend:  http://localhost:9002  (hot reload)
# Backend:   http://localhost:8000
# DB:        localhost:5432
#
# Secrets:
#   Copy backend/.env.example → backend/.env  and fill in values
#   Copy frontend/.env.example → frontend/.env and fill in values
# ================================================================

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: lifeos-db
    restart: unless-stopped
    env_file: backend/.env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lifeos}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lifeos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lifeos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────────
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    image: lifeos-backend:local
    container_name: lifeos-backend
    restart: unless-stopped
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT_HOST:-8000}:8000"
    environment:
      SERVER_PORT:                8000
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB:-lifeos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks:
      - lifeos-net

  # ── Next.js Frontend (dev with hot reload) ─────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: dev          # hot-reload dev server
    image: lifeos-frontend:local
    container_name: lifeos-frontend
    restart: unless-stopped
    env_file: frontend/.env
    depends_on:
      - backend
    ports:
      - "9002:9002"
    volumes:
      # Bind-mount source for hot reload; exclude build artifacts
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Browser talks to the host-mapped backend port
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_USE_MOCK_API: "false"
    networks:
      - lifeos-net

volumes:
  postgres_data:

networks:
  lifeos-net:
    driver: bridge
